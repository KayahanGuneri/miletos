name: miletos-auth-runtime

services:
  frontend:
    image: miletos-frontend:latest
    build:
      context: ../miletos-fe
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${MILETOS_FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
      runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    image: miletos-backend:latest
    build:
      context: .
    restart: unless-stopped
    env_file:
      - ./miletos-go/.env
    environment:
      MILETOS_DB_URL: jdbc:postgresql://postgres:5432/${MILETOS_POSTGRES_DB:-miletos}
      MILETOS_DB_USERNAME: ${MILETOS_POSTGRES_USER:-miletos}
      MILETOS_DB_PASSWORD: ${MILETOS_POSTGRES_PASSWORD:-miletos}
      MILETOS_REDIS_HOST: redis
      MILETOS_REDIS_PORT: 6379
      MILETOS_MAIL_HOST: mailhog
      MILETOS_MAIL_PORT: 1025
      MILETOS_RUNTIME_GRPC_HOST: runtime
      MILETOS_RUNTIME_GRPC_PORT: 9091
      MILETOS_WEB_BASE_URL: ${MILETOS_WEB_BASE_URL:-http://localhost:3000}
      MILETOS_CORS_ALLOWED_ORIGINS: ${MILETOS_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      MILETOS_PROFILE_PHOTO_STORAGE_DIRECTORY: /app/uploads/profile-photos
      MILETOS_WORKFLOW_INPUT_DIRECTORY: /app/workflow-inputs
    ports:
      - "${MILETOS_BACKEND_HOST_PORT:-8080}:8080"
    volumes:
      - miletos-profile-photos:/app/uploads/profile-photos
      - miletos-workflow-inputs:/app/workflow-inputs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  runtime:
    image: miletos-runtime:latest
    build:
      context: ./miletos-go
    restart: unless-stopped
    env_file:
      - ./miletos-go/.env
    environment:
      MILETOS_RUNTIME_ENVIRONMENT: docker
      MILETOS_RUNTIME_HTTP_HOST: 0.0.0.0
      MILETOS_RUNTIME_HTTP_PORT: 8081
      MILETOS_RUNTIME_GRPC_HOST: 0.0.0.0
      MILETOS_RUNTIME_GRPC_PORT: 9091
      MILETOS_RUNTIME_PUBLIC_TRIGGER_BASE_URL: ${MILETOS_RUNTIME_PUBLIC_TRIGGER_BASE_URL:-http://localhost:8081}
      MILETOS_RUNTIME_POSTGRES_HOST: postgres
      MILETOS_RUNTIME_POSTGRES_URL: ""
      MILETOS_RUNTIME_POSTGRES_PORT: 5432
      MILETOS_RUNTIME_POSTGRES_DATABASE: ${MILETOS_POSTGRES_DB:-miletos}
      MILETOS_RUNTIME_POSTGRES_USER: ${MILETOS_POSTGRES_USER:-miletos}
      MILETOS_RUNTIME_POSTGRES_PASSWORD: ${MILETOS_POSTGRES_PASSWORD:-miletos}
      MILETOS_RUNTIME_POSTGRES_SSL_MODE: disable
      MILETOS_RUNTIME_KAFKA_ENABLED: "true"
      MILETOS_RUNTIME_KAFKA_BROKERS: kafka:29092
      MILETOS_RUNTIME_INPUT_DIRECTORY: /app/input
    ports:
      - "${MILETOS_RUNTIME_HTTP_HOST_PORT:-8081}:8081"
      - "${MILETOS_RUNTIME_GRPC_HOST_PORT:-9091}:9091"
    volumes:
      - miletos-workflow-inputs:/app/input
    depends_on:
      backend:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      sftp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MILETOS_POSTGRES_DB:-miletos}
      POSTGRES_USER: ${MILETOS_POSTGRES_USER:-miletos}
      POSTGRES_PASSWORD: ${MILETOS_POSTGRES_PASSWORD:-miletos}
    ports:
      - "${MILETOS_POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - miletos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  output-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MILETOS_OUTPUT_POSTGRES_DB:-miletos_output}
      POSTGRES_USER: ${MILETOS_OUTPUT_POSTGRES_USER:-miletos_out}
      POSTGRES_PASSWORD: ${MILETOS_OUTPUT_POSTGRES_PASSWORD:-miletos_out}
    ports:
      - "${MILETOS_OUTPUT_POSTGRES_HOST_PORT:-55480}:5432"
    volumes:
      - miletos-output-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${MILETOS_REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "${MILETOS_MAILHOG_SMTP_HOST_PORT:-1025}:1025"
      - "${MILETOS_MAILHOG_UI_HOST_PORT:-8025}:8025"

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    restart: unless-stopped
    ports:
      - "${MILETOS_KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://127.0.0.1:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - miletos-kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh           --bootstrap-server kafka:29092           --create           --if-not-exists           --topic miletos.workflow.node.commands.v1           --partitions 1           --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh           --bootstrap-server kafka:29092           --create           --if-not-exists           --topic miletos.plugin.events.v1           --partitions 1           --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh           --bootstrap-server kafka:29092           --create           --if-not-exists           --topic miletos.workflow.node.dead-letter.v1           --partitions 1           --replication-factor 1
    restart: "no"

  sftp-init:
    image: atmoz/sftp:alpine
    restart: "no"
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        chown -R 1000:100 /data
        chmod 0755 /data
    volumes:
      - miletos-sftp-data:/data

  sftp:
    image: miletos-sftp:latest
    build:
      context: ./sftp
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      sftp-init:
        condition: service_completed_successfully
    ports:
      - "${MILETOS_SFTP_HOST_PORT:-2222}:22"
    command: miletos:miletos:::upload
    volumes:
      - miletos-sftp-data:/home/miletos/upload
      - miletos-sftp-host-keys:/var/lib/miletos-sftp-host-keys
    healthcheck:
      test: ["CMD-SHELL", "pgrep sshd >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  miletos-postgres-data:
  miletos-output-postgres-data:
  miletos-kafka-data:
  miletos-sftp-data:
  miletos-sftp-host-keys:
  miletos-profile-photos:
  miletos-workflow-inputs:
