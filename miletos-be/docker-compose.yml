name: miletos-auth-runtime

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MILETOS_POSTGRES_DB:-miletos}
      POSTGRES_USER: ${MILETOS_POSTGRES_USER:-miletos}
      POSTGRES_PASSWORD: ${MILETOS_POSTGRES_PASSWORD:-miletos}
    ports:
      - "${MILETOS_POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - miletos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "${MILETOS_MAILHOG_SMTP_HOST_PORT:-1025}:1025"
      - "${MILETOS_MAILHOG_UI_HOST_PORT:-8025}:8025"

volumes:
  miletos-postgres-data: