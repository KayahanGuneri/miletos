spring.application.name=miletos-be

# Server
server.port=${MILETOS_SERVER_PORT:8080}

# PostgreSQL
spring.datasource.url=${MILETOS_DB_URL:jdbc:postgresql://localhost:55432/miletos}
spring.datasource.username=${MILETOS_DB_USERNAME:miletos}
spring.datasource.password=${MILETOS_DB_PASSWORD:miletos}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Error response security
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Frontend and mail links
miletos.web.base-url=${MILETOS_WEB_BASE_URL:http://localhost:3000}
miletos.mail.from=${MILETOS_MAIL_FROM:no-reply@miletos.local}

# Mail
spring.mail.host=${MILETOS_MAIL_HOST:localhost}
spring.mail.port=${MILETOS_MAIL_PORT:1025}
spring.mail.username=${MILETOS_MAIL_USERNAME:}
spring.mail.password=${MILETOS_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MILETOS_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MILETOS_MAIL_SMTP_STARTTLS:false}

# JWT
miletos.security.jwt.secret=${MILETOS_JWT_SECRET:dev-only-change-this-secret-key-for-miletos-auth-flow-32-bytes-minimum}
miletos.security.jwt.issuer=${MILETOS_JWT_ISSUER:https://miletos.local}
miletos.security.jwt.access-token-minutes=${MILETOS_JWT_ACCESS_TOKEN_MINUTES:30}

# CORS
miletos.security.cors.allowed-origins=${MILETOS_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
miletos.security.cors.allowed-methods=${MILETOS_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
miletos.security.cors.allowed-headers=${MILETOS_CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Accept-Language,Origin,X-Requested-With}
miletos.security.cors.exposed-headers=${MILETOS_CORS_EXPOSED_HEADERS:Location}
miletos.security.cors.allow-credentials=${MILETOS_CORS_ALLOW_CREDENTIALS:false}
miletos.security.cors.max-age=${MILETOS_CORS_MAX_AGE:3600}

# Password reset
miletos.security.password-reset-token-minutes=${MILETOS_PASSWORD_RESET_TOKEN_MINUTES:30}

# Redis
spring.data.redis.host=${MILETOS_REDIS_HOST:localhost}
spring.data.redis.port=${MILETOS_REDIS_PORT:6379}
spring.data.redis.password=${MILETOS_REDIS_PASSWORD:}
spring.data.redis.timeout=${MILETOS_REDIS_TIMEOUT:2s}

# Authentication session
miletos.security.session.key-prefix=${MILETOS_SESSION_KEY_PREFIX:miletos:auth:session}

# Invite cleanup scheduler
miletos.security.invite-cleanup.initial-delay-ms=${MILETOS_INVITE_CLEANUP_INITIAL_DELAY_MS:60000}
miletos.security.invite-cleanup.fixed-delay-ms=${MILETOS_INVITE_CLEANUP_FIXED_DELAY_MS:60000}

# Profile photo storage
miletos.profile-photo.storage-directory=${MILETOS_PROFILE_PHOTO_STORAGE_DIRECTORY:uploads/profile-photos}
miletos.profile-photo.max-size-bytes=${MILETOS_PROFILE_PHOTO_MAX_SIZE_BYTES:2097152}

# OpenAPI
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Localization
