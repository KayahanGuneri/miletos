<!doctype html>
<html><body style="margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#17202a">
<div style="max-width:600px;margin:24px auto;background:#fff;border-radius:8px;padding:32px">
<h1 style="font-size:24px;margin:0 0 20px">Reset your Miletos password</h1>
<p style="line-height:1.6">Hello {{firstName}},</p>
<p style="line-height:1.6">A password reset was requested for your Miletos account.</p>
<p style="margin:28px 0"><a href="{{resetLink}}" style="background:#2563eb;color:#fff;text-decoration:none;padding:12px 20px;border-radius:6px;display:inline-block">Reset password</a></p>
<p style="line-height:1.6">If the button does not work, copy this URL into your browser:</p>
<p style="word-break:break-all"><a href="{{resetLink}}">{{resetLink}}</a></p>
<p style="color:#5f6b76;font-size:14px">This password reset link expires in {{expiresInMinutes}} minutes.</p>
</div></body></html>
